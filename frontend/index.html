<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // Immediate trailing-slash redirect to ensure relative assets resolve properly
      if (window.location.pathname === '/grocery_list') {
        window.location.replace('/grocery_list/' + window.location.search + window.location.hash);
      }
    </script>
    
    <!-- PWA Standalone Meta Tags -->
    <meta name="theme-color" content="#f6f8f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="רשימת קניות" />
    <meta name="application-name" content="רשימת קניות" />
    
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>רשימת קניות</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f6f8f6] text-[#1e232a] antialiased font-sans select-none min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new Event('can-install-pwa'));
      });
    </script>
  </body>
</html>
