# Main Grocery List Application (Port 80 -> host 8888)
# Supports both root path (/) and subpath (/grocery_list/) for Tailscale Funnel
server {
    listen 80;
    server_name localhost;

    # Root path
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Tailscale Funnel / Reverse Proxy subpath
    location /grocery_list/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ /grocery_list/index.html /index.html;
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /grocery_list/manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /grocery_list/sw.js {
        alias /usr/share/nginx/html/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /grocery_list/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Local Emergency Recovery Portal (Port 8889)
# Accessible only from local network, never exposed via Funnel
server {
    listen 8889;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files /recovery.html =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
